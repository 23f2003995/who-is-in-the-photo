<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="440" fill="#ffffff"/>
<text x="20" y="26" font-size="18" font-weight="700" fill="#1e293b">Who Is in the Photo? Architecture (fully offline, one laptop)</text>
<g stroke-width="2" fill-opacity="1">
<rect x="20" y="50" width="190" height="110" rx="12" fill="#e0e7ff" stroke="#4f46e5"/>
<rect x="270" y="50" width="200" height="110" rx="12" fill="#dcfce7" stroke="#16a34a"/>
<rect x="530" y="50" width="190" height="110" rx="12" fill="#fef3c7" stroke="#d97706"/>
<rect x="780" y="50" width="160" height="110" rx="12" fill="#fef3c7" stroke="#d97706"/>
<rect x="780" y="270" width="160" height="110" rx="12" fill="#f1f5f9" stroke="#64748b"/>
<rect x="530" y="270" width="190" height="110" rx="12" fill="#fce7f3" stroke="#db2777"/>
<rect x="270" y="270" width="200" height="110" rx="12" fill="#dcfce7" stroke="#16a34a"/>
<rect x="20" y="270" width="190" height="110" rx="12" fill="#e0e7ff" stroke="#4f46e5"/>
</g>
<g font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">
<text x="115" y="85">Browser UI</text><text x="370" y="85">Flask API</text><text x="625" y="85">YuNet detector</text><text x="860" y="85">SFace embedder</text>
<text x="860" y="305">In-memory gallery</text><text x="625" y="305">Cosine matching</text><text x="370" y="305">JSON results</text><text x="115" y="305">Result screen</text></g>
<g font-size="12.5" fill="#334155" text-anchor="middle">
<text x="115" y="108">static/index.html</text><text x="115" y="128">1. pick people folder</text><text x="115" y="146">2. upload group photo</text>
<text x="370" y="108">app.py</text><text x="370" y="128">POST /api/gallery</text><text x="370" y="146">POST /api/identify</text>
<text x="625" y="108">finds every face</text><text x="625" y="128">box + 5 landmarks</text><text x="625" y="146">(ONNX, CPU)</text>
<text x="860" y="108">align + crop face</text><text x="860" y="128">128-number vector</text><text x="860" y="146">(ONNX, CPU)</text>
<text x="860" y="328">name + vector</text><text x="860" y="348">for each of 50 people</text><text x="860" y="366">(reset on each load)</text>
<text x="625" y="328">threshold 0.30</text><text x="625" y="348">best pairs first,</text><text x="625" y="366">one person = one face</text>
<text x="370" y="328">name, score, box</text><text x="370" y="348">per face, left to right</text>
<text x="115" y="328">boxes on the photo</text><text x="115" y="348">green = known, red = Unknown</text><text x="115" y="366">plus a list</text></g>
<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
<path d="M210 105H268"/><path d="M470 105H528"/><path d="M720 105H778"/>
<path d="M860 160V268"/><path d="M780 325H722"/><path d="M530 325H472"/><path d="M270 325H212"/>
<path d="M800 160L720 280" stroke-dasharray="6 4"/></g>
<g font-size="11.5" fill="#475569"><text x="870" y="218">folder photos</text><text x="715" y="205" text-anchor="end">group-photo faces</text></g>
<text x="20" y="418" font-size="13" fill="#475569">No network calls at runtime. Models (yunet.onnx, sface.onnx) are stored in the repo under models/.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
