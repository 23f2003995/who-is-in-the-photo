<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who Is in the Photo?</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1c2033;--mut:#6b7188;--brand:#4f46e5;--ok:#16a34a;--bad:#e11d48;--line:#e4e6f0}
@media(prefers-color-scheme:dark){:root{--bg:#12131c;--card:#1c1e2b;--ink:#eceef8;--mut:#9aa0b8;--line:#2d3042}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:28px 32px 8px}h1{margin:0;font-size:28px}header p{margin:4px 0 0;color:var(--mut)}
main{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:20px 32px 40px;max-width:1300px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.step{display:flex;gap:10px;align-items:center;font-weight:600;margin-bottom:10px}
.step b{background:var(--brand);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:14px}
button.big{width:100%;padding:14px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button.big:disabled{opacity:.45;cursor:not-allowed}button.big.alt{background:transparent;color:var(--brand);border:2px dashed var(--brand)}
.status{margin:10px 0 0;color:var(--mut);font-size:14px}.warn{color:var(--bad)}
.stage{position:relative;display:inline-block;max-width:100%;border-radius:12px;overflow:hidden}
.stage img{display:block;max-width:100%;max-height:70vh}
.box{position:absolute;border:3px solid var(--ok);border-radius:6px}.box.unk{border-color:var(--bad)}
.box span{position:absolute;left:-3px;bottom:100%;margin-bottom:2px;background:var(--ok);color:#fff;font-size:13px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.box.unk span{background:var(--bad)}
ul{list-style:none;margin:14px 0 0;padding:0}li{display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
li.unk{color:var(--bad)}li small{color:var(--mut)}.empty{color:var(--mut);padding:60px 0;text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes r{to{transform:rotate(360deg)}}
</style></head><body>
<header><h1>Who Is in the Photo?</h1></header>
<main>
 <div>
  <div class="card"><div class="step"><b>1</b>Choose the people folder</div>
   <input id="dir" type="file" webkitdirectory multiple hidden>
   <button class="big alt" id="pickDir">📁 Open folder of people</button>
   <p class="status" id="dirStatus">Each file is named after the person, e.g. Priya Sharma.jpg</p></div>
  <div class="card" style="margin-top:16px"><div class="step"><b>2</b>Upload the group photo</div>
   <input id="pic" type="file" accept="image/*" hidden>
   <button class="big" id="pickPic" disabled>🖼️ Upload group photo</button>
   <p class="status" id="picStatus"></p></div>
 </div>
 <div class="card"><div id="out"><div class="empty">Results will appear here.</div></div></div>
</main>
<script>
const $=id=>document.getElementById(id);let ready=false;
$("pickDir").onclick=()=>$("dir").click();$("pickPic").onclick=()=>$("pic").click();
$("dir").onchange=async e=>{
  const files=[...e.target.files].filter(f=>/\.(jpe?g|png|webp|bmp)$/i.test(f.name));
  if(!files.length){$("dirStatus").textContent="No images found in that folder.";return}
  $("dirStatus").innerHTML='<span class="spin"></span>Learning '+files.length+' faces…';
  const fd=new FormData();files.forEach(f=>fd.append("files",f,f.name));
  try{const r=await(await fetch("/api/gallery",{method:"POST",body:fd})).json();
    ready=r.count>0;$("pickPic").disabled=!ready;
    $("dirStatus").innerHTML="✅ "+r.count+" people ready."+(r.skipped.length?'<br><span class="warn">No face found in: '+r.skipped.join(", ")+"</span>":"");
  }catch(err){$("dirStatus").innerHTML='<span class="warn">Failed: '+err+"</span>"}
};
$("pic").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $("picStatus").innerHTML='<span class="spin"></span>Identifying…';
  const fd=new FormData();fd.append("photo",f);
  const r=await(await fetch("/api/identify",{method:"POST",body:fd})).json();
  if(r.error){$("picStatus").innerHTML='<span class="warn">'+r.error+"</span>";return}
  $("picStatus").textContent=r.results.length+" face(s) found.";
  const url=URL.createObjectURL(f);
  const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const boxes=r.results.map(x=>`<div class="box ${x.known?"":"unk"}" style="left:${x.box[0]*100}%;top:${x.box[1]*100}%;width:${x.box[2]*100}%;height:${x.box[3]*100}%"><span>${esc(x.name)}</span></div>`).join("");
  const list=r.results.map(x=>`<li class="${x.known?"":"unk"}"><span>${x.known?"✅":"❓"} ${esc(x.name)}</span><small>match ${Math.round(x.score*100)}%</small></li>`).join("");
  $("out").innerHTML=`<div class="stage"><img src="${url}">${boxes}</div><ul>${list}</ul>`;
};
</script></body></html>
